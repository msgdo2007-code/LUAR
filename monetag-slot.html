<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicidade</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#101411;color:#eaf2ec}
    body{display:grid;place-items:center}
    #adLoading{position:absolute;inset:0;display:grid;place-content:center;gap:5px;padding:12px;text-align:center;border:1px solid rgba(50,255,126,.13);background:radial-gradient(circle at 50% 10%,rgba(50,255,126,.08),transparent 55%);pointer-events:none}
    #adLoading strong{font-size:10px}
    #adLoading small{color:#8f9a92;font-size:8px}
    body.ad-creative-ready #adLoading{display:none}
    body.ad-unavailable #adLoading{background:rgba(255,255,255,.018)}
    body.ad-unavailable #adLoading strong{color:#aeb8b1}
    body>iframe,body>a,body>img{position:relative;z-index:2;max-width:100%;max-height:100%}
  </style>
</head>
<body>
  <div id="adLoading"><strong>Preparando publicidade</strong><small>Conteúdo patrocinado</small></div>
  <script>(function(s){s.dataset.zone='11495936',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <script>(function(s){s.dataset.zone='11495938',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <script src="https://quge5.com/88/tag.min.js" data-zone="266610" async data-cfasync="false"></script>
  <script>
    const notify=status=>parent.postMessage({type:'luar-ad-status',status},location.origin),adLoading=document.getElementById('adLoading'),adTimeout=setTimeout(()=>{if(document.body.classList.contains('ad-creative-ready'))return;document.body.classList.add('ad-unavailable');adLoading.innerHTML='<strong>Publicidade indisponível no momento</strong><small>O espaço tentará carregar novamente ao trocar de página.</small>';notify('unavailable')},7000);
    const adObserver=new MutationObserver(()=>{if(!document.body.querySelector('iframe,a[href],img'))return;clearTimeout(adTimeout);document.body.classList.remove('ad-unavailable');document.body.classList.add('ad-creative-ready');notify('ready');adObserver.disconnect()});
    adObserver.observe(document.body,{childList:true,subtree:true});
  </script>
</body>
</html>
